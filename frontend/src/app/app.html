<header class="app-bar">
  <span class="brand">webdisktree</span>
  <nav class="nav-links">
    <a routerLink="/scans" routerLinkActive="active">Scans</a>
    <a routerLink="/scans/new" routerLinkActive="active">New Scan</a>
    <a routerLink="/schedules" routerLinkActive="active">Schedules</a>
  </nav>

  <button
    type="button"
    class="theme-toggle"
    (click)="cycleTheme()"
    [attr.aria-label]="'Theme: ' + theme.preference() + '. Switch to ' + nextTheme() + '.'"
    [title]="'Theme: ' + theme.preference() + ' — click for ' + nextTheme()"
  >
    <mat-icon>{{ themeIcon() }}</mat-icon>
  </button>
</header>

<main class="content">
  <router-outlet />
</main>
