@if (loading()) {
  <p>Loading…</p>
} @else if (entries().length === 0) {
  <p>No files scanned yet.</p>
} @else {
  <div class="breakdown-list">
    @for (entry of entries(); track entry.extension) {
      <div class="breakdown-row">
        <span class="ext">{{ entry.extension }}</span>
        <div class="bar-track">
          <div class="bar-fill" [style.width]="barWidth(entry)" [style.background]="barColor(entry)"></div>
        </div>
        <span class="size">{{ entry.totalSizeBytes | formatBytes }}</span>
        <span class="count">{{ entry.fileCount }} files</span>
      </div>
    }
  </div>
}
