services:
  webdisktree:
    build: .
    image: webdisktree:latest
    ports:
      - "8080:8080"
    volumes:
      - webdisktree-data:/data
      # The host filesystem, read-only. Drives and mounts under /hostfs are detected automatically.
      - /:/hostfs:ro
      # Delete is allowed only on read-write mounts. Uncomment and adjust to allow deleting under a specific path:
      # - /home/you/Downloads:/hostfs/home/you/Downloads:rw
    environment:
      # IMDB lookups are disabled until a TMDb API key is set. Never hardcode the real key here —
      # set TMDB_API_KEY in the deployment environment (e.g. Portainer's stack env vars) instead.
      - Tmdb__ApiKey=${TMDB_API_KEY:-}
    restart: unless-stopped

volumes:
  webdisktree-data:
